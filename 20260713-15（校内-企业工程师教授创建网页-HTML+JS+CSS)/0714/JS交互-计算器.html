<!DOCTYPE html>
<html>
 <head>
  <meta charset="UTF-8">
  <title>calculator</title>
  <style>
	  .btn{
		width:160px;
		height:160px;
		margin:5px;
		font-size:50px;
	  }
  </style>
 </head>
 <body>
	<div style="width:700px;height:900px;border:1px solid black;margin:50px auto;">
		<!--实现输入输出显示框-->
		<div style="width:100%;height:200px;border:1px solid black;text-align:center;">
			<input id="numshow" type="text" readonly style="height:100px;font-size:55px;color:blue;margin-top:40px;text-align:right;"/><!--input单标签,"/"表示结束-->
		</div>
		
		<!--按键区-->
		<div style="width:100%;height:700px;border:1px solid black;">
			<button class="btn" onclick="addnum('1')">1</button>
			<button class="btn" onclick="addnum('2')">2</button>
			<button class="btn" onclick="addnum('3')">3</button>
			<button class="btn" onclick="devide()">/</button>
			<button class="btn" onclick="addnum('4')">4</button>
			<button class="btn" onclick="addnum('5')">5</button>
			<button class="btn" onclick="addnum('6')">6</button>
			<button class="btn" onclick="multiply()">x</button>
			<button class="btn" onclick="addnum('7')">7</button>
			<button class="btn" onclick="addnum('8')">8</button>
			<button class="btn" onclick="addnum('9')">9</button>
			<button class="btn" onclick="subtract()">-</button>
			<button class="btn" onclick="del()">C</button>
			<button class="btn" onclick="addnum('0')">0</button>
			<button class="btn" onclick="add()">+</button>
			<button class="btn" onclick="equ()">=</button>
			<button class="btn" onclick="clr()">CE</button>
		</div>
	
	</div>

	<script type="text/javascript">
		var first_num;//第一操作数
		var flag=0;//1表示加法，2减法，3乘法，4除法
		
		//输入数字
		function addnum(num){
			console.log(num);
			var numshowVal=document.getElementById("numshow").value;//获取当前输入框的值
			document.getElementById("numshow").value=(numshowVal+num);//再与输入的值进行拼接，再设置到输入框中
		}	
		
		//清空
		function clr(){
			document.getElementById("numshow").value="";
		}
		
		//加号触发
		function add(){
			flag=1;
			first_num=document.getElementById("numshow").value;//获取当前输入框内容，保存至全局变量里面
			document.getElementById("numshow").value="";//清空输入框
		}
		
		function subtract(){
			flag=2;
			first_num=document.getElementById("numshow").value;
			document.getElementById("numshow").value='';
		}	
		
		function multiply(){
			flag=3;
			first_num=document.getElementById("numshow").value;
			document.getElementById("numshow").value='';
		}	
		
		function devide(){
			flag=4;
			first_num=document.getElementById("numshow").value;
			document.getElementById("numshow").value='';
		}	
		
		
		
		//等号触发
		function equ(){
			var cur_num = document.getElementById("numshow").value;
			switch(flag){         //无':'!!!!
				case 1://加法
					//first_num;
					
					var add_res = parseFloat(first_num)+parseFloat(cur_num);//将全局变量里的值 和当前输入框里的值相加
					document.getElementById("numshow").value = add_res;//add_res回显到输入框中
					break;
				case 2:
					
					var sub_res = parseFloat(first_num)-parseFloat(cur_num);
					document.getElementById("numshow").value = sub_res;
					break;
				case 3:
					
					var mul_res = parseFloat(first_num)*parseFloat(cur_num);
					document.getElementById("numshow").value = mul_res;
					break;
				case 4:
					
					var dev_res = parseFloat(first_num)/parseFloat(cur_num);
					document.getElementById("numshow").value = dev_res;
					break;
			
			}
		}
		
		//退格键
		function del(){
			var v=document.getElementById("numshow").value;//获取当前输入框的文本内容
			var res=v.length>0 ? v.substring(0,v.length-1) : '';
			document.getElementById("numshow").value=res;//截取的结果返回到输入框
	
		}
	
	</script>
 </body>
</html>
